downloads-dir = "/data/downloads"

email-listing-datetime-fmt = "%F %H:%M"
email-listing-datetime-local-tz = true

[privateemail.folder-aliases]
inbox = "INBOX"
deleted = "Trash"
drafts = "Drafts"
sent = "Sent"
spam = "Spam"
archive = "Archive"
house = "House"
waiting = "Waiting"
car = "Car"

[privateemail]
default = true
backend = "imap"
sender = "smtp"
#sync = true
#sync-dir = "/data/email"
#sync-folders-strategy = "all"

email = "@EMAIL@"

imap-host = "mail.privateemail.com"
imap-port = 993
imap-login = "@EMAIL@"
imap-auth = "password"
imap-passwd = { cmd = "/data/code/nixos-files/secrets/privateemail_password" }
imap-ssl = true

smtp-host = "mail.privateemail.com"
smtp-port = 465
smtp-login = "@EMAIL@"
smtp-auth = "password"
smtp-passwd = { cmd = "/data/code/nixos-files/secrets/privateemail_password" }
smtp-ssl = true
